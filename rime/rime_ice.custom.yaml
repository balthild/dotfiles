# 雾凇拼音 https://github.com/iDvel/rime-ice

patch:
  engine/filters/+:
    - lua_filter@*custom_reduce_english
    - lua_filter@*custom_candidate_comment

  reduce_english_filter/+:
    mode: none

  pin_cand_filter:
    __include: default:/pin_cand_filter

  radical_lookup/prefix: "u"
  recognizer/patterns/radical_lookup: "^u[a-z]+$"

  translator/contextual_suggestions: true
  translator/max_homophones: 8
  translator/max_homographs: 8

  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 6
    collocation_min_length: 2
    collocation_penalty: -14
    non_collocation_penalty: -6
    weak_collocation_penalty: -100
    rear_penalty: -18

  switches:
    __include: default:/switches

  editor/bindings:
    __include: default:/editor/bindings
