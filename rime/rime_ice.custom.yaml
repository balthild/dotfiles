# 配合雾凇拼音使用 https://github.com/iDvel/rime-ice
patch:
  # Bug：当这里有 __include 时，后面指定合并（+）的选项会变成整个覆盖
  # __include: "rime_ice.custom.platform:/patch"

  punctuator/half_shape/+:
    "/": "、"
    "`": "·"
    "[": "「"
    "]": "」"
    "{": "『"
    "}": "』"
  punctuator/full_shape/+:
    "/": "、"
    "`": "·"
    "[": "“"
    "]": "”"
    "{": "‘"
    "}": "’"

  ascii_composer/+:
    good_old_caps_lock: true
    switch_key:
      __patch:
        - options.platform:/switch_key
      Control_L: noop
      Control_R: noop
      Shift_L: commit_code
      Shift_R: commit_code
      Caps_Lock: commit_code
      Eisu_toggle: commit_code

  key_binder/bindings/+:
    __patch:
      - key_bindings:/paging_with_comma_period
      - /bindings

  reduce_english_filter/+:
    mode: none
  force_reduce_english_filter/+:
    idx: 5
  engine/filters/+:
    - lua_filter@*force_reduce_english_filter

  radical_lookup/prefix: "u"
  recognizer/patterns/radical_lookup: "^u[a-z]+$"

  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 5
    collocation_min_length: 2

  translator/contextual_suggestions: true
  translator/max_homophones: 7
  translator/max_homographs: 7

  switches:
    - name: full_shape
      states: [半, 全]
      reset: 0
    - name: traditionalization
      states: [简, 繁]
      reset: 0
    - name: ascii_punct
      states: [¥, $]
      reset: 0
    - name: emoji
      states: [☠️, 😀]
      reset: 1

  editor:
    bindings:
      Shift+BackSpace: delete_candidate

bindings:
  __append:
    # - { when: always, accept: Shift+space, toggle: full_shape }
