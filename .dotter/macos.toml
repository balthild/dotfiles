[default]
depends = [ #
  "git",
  "shell",
  "helix",
  "rime",
  "copilot",
  "nix",
  "misc",
  "secret",
  "brew",
]

[git.files]
"git/desktop.gitconfig" = "~/.gitconfig"

[shell.files]
"shell/carapace" = "~/Library/Application Support/carapace/"
"shell/ghostty.conf" = "~/Library/Application Support/com.mitchellh.ghostty/config"
"shell/nushell" = "~/Library/Application Support/nushell/"

[rime.files]
# "rime" = "~/.local/share/fcitx5/rime/"
"rime" = "~/Library/Rime/"
"rime/options.macos.yaml" = "~/Library/Rime/options.platform.yaml"

[brew.files]
"brew" = "/opt/homebrew/Library/Taps/balthild/homebrew-dotfiles"
